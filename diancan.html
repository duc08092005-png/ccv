let cart = {};

function money(value) {
  return "NT$" + value.toLocaleString("en-US");
}

function renderMenu() {
  const keyword = document.getElementById("search").value
    .trim().toLowerCase();

  const menu = document.getElementById("menu");
  const tabs = document.getElementById("tabs");

  menu.innerHTML = "";
  tabs.innerHTML = "";

  groups.forEach((group, index) => {
    const matched = group.items.filter(item =>
      item[0].toLowerCase().includes(keyword) ||
      (item[2] || "").toLowerCase().includes(keyword)
    );

    if (!matched.length) return;

    const tab = document.createElement("button");
    tab.textContent = group.title.split("｜")[0];

    tab.onclick = () => {
      document.getElementById("section-" + index)
        ?.scrollIntoView({ behavior: "smooth" });
    };

    tabs.appendChild(tab);

    const section = document.createElement("section");
    section.id = "section-" + index;

    const heading = document.createElement("h2");
    heading.textContent = group.title;
    section.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "menu-grid";

    matched.forEach(item => {
      const name = item[0];
      const price = item[1];
      const description = item[2] || "";

      const card = document.createElement("article");
      card.className = "item";

      const title = document.createElement("h3");
      title.textContent = name;
      card.appendChild(title);

      if (description) {
        const desc = document.createElement("p");
        desc.className = "note";
        desc.textContent = description;
        card.appendChild(desc);
      }

      const bottom = document.createElement("div");
      bottom.className = "item-bottom";

      const priceEl = document.createElement("span");
      priceEl.className = "price";
      priceEl.textContent = money(price);

      const add = document.createElement("button");
      add.className = "add";
      add.textContent = "＋ 加入";
      add.onclick = () => addToCart(name, price);

      bottom.append(priceEl, add);
      card.appendChild(bottom);
      grid.appendChild(card);
    });

    section.appendChild(grid);
    menu.appendChild(section);
  });
}

function addToCart(name, price) {
  if (cart[name]) {
    cart[name].qty++;
  } else {
    cart[name] = { price: price, qty: 1 };
  }

  renderCart();
}

function changeQty(name, amount) {
  if (!cart[name]) return;

  cart[name].qty += amount;

  if (cart[name].qty <= 0) {
    delete cart[name];
  }

  renderCart();
}

function removeItem(name) {
  delete cart[name];
  renderCart();
}

function renderCart() {
  const box = document.getElementById("cartItems");
  box.innerHTML = "";

  let total = 0;
  const entries = Object.entries(cart);

  if (entries.length === 0) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = "尚未選擇餐點";
    box.appendChild(empty);
  }

  entries.forEach(([name, item]) => {
    total += item.price * item.qty;

    const row = document.createElement("div");
    row.className = "cart-item";

    const title = document.createElement("div");
    title.className = "cart-name";
    title.textContent = name + " — " + money(item.price * item.qty);

    const controls = document.createElement("div");
    controls.className = "cart-controls";

    const minus = document.createElement("button");
    minus.textContent = "−";
    minus.onclick = () => changeQty(name, -1);

    const qty = document.createElement("span");
    qty.textContent = item.qty;

    const plus = document.createElement("button");
    plus.textContent = "＋";
    plus.onclick = () => changeQty(name, 1);

    const remove = document.createElement("button");
    remove.textContent = "移除";
    remove.className = "remove";
    remove.onclick = () => removeItem(name);

    controls.append(minus, qty, plus, remove);
    row.append(title, controls);
    box.appendChild(row);
  });

  document.getElementById("total").textContent = money(total);
}

function toggleTable() {
  const takeaway = document.getElementById("orderType").value === "外帶";
  document.getElementById("tableField").style.display =
    takeaway ? "none" : "block";
}

function checkout() {
  const entries = Object.entries(cart);

  if (!entries.length) {
    alert("請先選擇餐點！");
    return;
  }

  const type = document.getElementById("orderType").value;
  const table = document.getElementById("table").value;

  if (type === "內用" && !table) {
    alert("請選擇內用桌號！");
    return;
  }

  let total = 0;

  const lines = entries.map(([name, item]) => {
    const subtotal = item.price * item.qty;
    total += subtotal;
    return `${name} × ${item.qty} = ${money(subtotal)}`;
  });

  const name = document.getElementById("customerName").value || "未填寫";
  const phone = document.getElementById("phone").value || "未填寫";
  const note = document.getElementById("orderNote").value || "無";

  const summary =
`CACCONVO 早午餐｜訂單摘要

用餐方式：${type}
${type === "內用" ? "桌號：" + table : ""}
稱呼：${name}
電話：${phone}

${lines.join("\n")}

總金額：${money(total)}

備註：${note}

提醒：這只是訂單摘要，尚未傳送至店家。`;

  alert(summary);
}

renderMenu();
renderCart();
</script>

</html>
